<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نظام إدارة المتجر والمبيعات</title>

    <!-- Tailwind CSS CDN -->

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>

</head>

<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">



    <!-- Navbar -->

    <header class="bg-indigo-900 text-white shadow-lg no-print">

        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">

            <div class="flex items-center gap-3">

                <h1 id="appTitle" class="text-xl font-bold tracking-wide">نظام إدارة المتجر المتقدم</h1>

            </div>



            <!-- Firebase Auth Controls -->

                    <button onclick="loginWithGoogle()" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded font-medium flex items-center gap-1.5 transition">

                        <i class="fa-brands fa-google"></i> <span data-i18n="loginGoogle">تسجيل بالمتصفح</span>

                    </button>

                </div>

                <div id="authLoggedIn" class="hidden flex items-center gap-2">

                    <span id="userName" class="text-xs font-semibold text-indigo-200 max-w-[100px] truncate"></span>

                    <button onclick="logoutFirebase()" class="text-slate-300 hover:text-white text-xs bg-indigo-800 px-2 py-1 rounded">

                        <i class="fa-solid fa-right-from-bracket"></i>

                    </button>

                </div>

            </div>



            <!-- Cloud Actions & Language -->

            <div class="flex items-center gap-2">

                <button onclick="backupToFirebase()" title="حفظ نسخة احتياطية للسحابة" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded flex items-center gap-1">

                    <i class="fa-solid fa-cloud-arrow-up"></i> <span data-i18n="cloudBackup">حفظ سحابي</span>

                </button>

                <button onclick="restoreFromFirebase()" title="استعادة النسخة الاحتياطية من السحابة" class="bg-amber-600 hover:bg-amber-700 text-white text-xs px-3 py-1.5 rounded flex items-center gap-1">

                </button>

                <button onclick="toggleLanguage()" class="bg-indigo-800 hover:bg-indigo-700 text-xs px-3 py-1.5 rounded font-bold">

                    <span id="langLabel">English</span>

                </button>

            </div>

        </div>

    </header>



    <!-- Navigation Tabs -->

    <nav class="bg-indigo-800 text-indigo-100 shadow no-print">

        <div class="container mx-auto px-4 flex overflow-x-auto gap-2">

            <button onclick="switchTab('dashboard')" class="tab-btn px-4 py-3 font-medium hover:bg-indigo-700 border-b-2 border-indigo-400 flex items-center gap-2" id="tab-dashboard">

                <i class="fa-solid fa-chart-line"></i> <span data-i18n="dashboard">لوحة التحكم</span>

            </button>

            <button onclick="switchTab('pos')" class="tab-btn px-4 py-3 font-medium hover:bg-indigo-700 border-b-2 border-transparent flex items-center gap-2" id="tab-pos">

                <i class="fa-solid fa-cash-register"></i> <span data-i18n="pos">نقطة البيع</span>

            </button>

            <button onclick="switchTab('sales')" class="tab-btn px-4 py-3 font-medium hover:bg-indigo-700 border-b-2 border-transparent flex items-center gap-2" id="tab-sales">

                <i class="fa-solid fa-receipt"></i> <span data-i18n="sales">المبيعات</span>

            </button>

            <button onclick="switchTab('expenses')" class="tab-btn px-4 py-3 font-medium hover:bg-indigo-700 border-b-2 border-transparent flex items-center gap-2" id="tab-expenses">

            <button onclick="switchTab('customers')" class="tab-btn px-4 py-3 font-medium hover:bg-indigo-700 border-b-2 border-transparent flex items-center gap-2" id="tab-customers">

                <i class="fa-solid fa-users"></i> <span data-i18n="customers">العملاء</span>

            </button>

    <!-- Main Content Area -->

        <!-- SECTION: DASHBOARD -->

                    <div class="text-slate-500 text-sm font-medium" data-i18n="totalSales">إجمالي المبيعات</div>

                    <div id="statTotalSales" class="text-3xl font-bold text-emerald-600 mt-2">0.00</div>

                </div>

                <h2 class="text-lg font-bold text-slate-700 mb-4 pb-2 border-b" data-i18n="createInvoice">إنشاء فاتورة جديدة</h2>

                

                <form id="posForm" onsubmit="addInvoice(event)" class="space-y-4">

                    <div>

                        <select id="posCustomer" class="w-full border rounded-lg p-2.5 bg-slate-50">

                            <option value="" data-i18n="generalCustomer">عميل نقدي (عام)</option>

                        </select>

                    </div>



                    <div>

                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="itemDescription">البيان / الوصف</label>

                        <input type="text" id="posDescription" required class="w-full border rounded-lg p-2.5 bg-slate-50" placeholder="وصف الخدمة أو المنتج">

                    </div>



                    <div class="grid grid-cols-2 gap-4">

                        <div>

                            <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="amount">المبلغ</label>

                            <input type="number" step="0.01" id="posAmount" required class="w-full border rounded-lg p-2.5 bg-slate-50" placeholder="0.00">

                        </div>

                        <div>

                            <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="date">التاريخ</label>

                        </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow transition" data-i18n="saveInvoice">

                        حفظ الفاتورة

                    </button>

                </form>

            </div>

        </section>



        <!-- SECTION: SALES (المبيعات) -->

                        <tr>

                            <th class="p-4" data-i18n="customer">العميل</th>

                            <th class="p-4" data-i18n="itemDescription">الوصف</th>

                            <th class="p-4" data-i18n="date">التاريخ</th>

                            <th class="p-4" data-i18n="amount">المبلغ</th>

        </section>

                <h3 class="text-md font-bold mb-3" data-i18n="addExpense">إضافة مصروف جديد</h3>

                    <input type="text" id="expDesc" placeholder="سبب الصرف" required class="w-full border p-2 rounded bg-slate-50">

                    <div class="grid grid-cols-2 gap-3">

                        <input type="number" step="0.01" id="expAmount" placeholder="المبلغ" required class="w-full border p-2 rounded bg-slate-50">

                        <input type="date" id="expDate" required class="w-full border p-2 rounded bg-slate-50">

                    </div>

                    <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-2 rounded" data-i18n="saveExpense">إضافة المصروف</button>

                </form>

            </div>



            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">

                <table class="w-full text-right">

                    <thead class="bg-slate-50 border-b">

                        <tr>

                            <th class="p-4" data-i18n="itemDescription">الوصف</th>

                            <th class="p-4" data-i18n="date">التاريخ</th>

                            <th class="p-4" data-i18n="amount">المبلغ</th>

                        </tr>

                    </thead>

                </table>

            </div>

        </section>



        <!-- SECTION: CUSTOMERS (العملاء) -->

        <section id="sectionCustomers" class="hidden space-y-4">

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 max-w-2xl mx-auto mb-6">

                <h3 class="text-md font-bold mb-3" data-i18n="addCustomer">إضافة عميل جديد</h3>

                <form id="customerForm" onsubmit="addCustomer(event)" class="space-y-3">

                    <input type="text" id="custName" placeholder="اسم العميل" required class="w-full border p-2 rounded bg-slate-50">

                    <input type="tel" id="custPhone" placeholder="رقم الهاتف" class="w-full border p-2 rounded bg-slate-50">

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded" data-i18n="saveCustomer">حفظ العميل</button>

                </form>

            </div>



            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">

                <table class="w-full text-right">

                    <thead class="bg-slate-50 border-b">

                        <tr>

                            <th class="p-4" data-i18n="customerName">اسم العميل</th>

                            <th class="p-4" data-i18n="phone">رقم الهاتف</th>

                            <th class="p-4 no-print" data-i18n="actions">إجراءات</th>

                        </tr>

                    </thead>

                    <tbody id="customersTableBody"></tbody>

                </table>

            </div>

        </section>



        <!-- SECTION: SETTINGS (الإعدادات والخطوط العربية 26) -->

                <h2 class="text-lg font-bold text-slate-700 mb-4 pb-2 border-b" data-i18n="storeSettings">إعدادات المتجر والتصميم</h2>

                

                <form onsubmit="saveSettings(event)" class="space-y-4">

                    <div>

                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="storeName">اسم المتجر / الشركة</label>

                            <option value="Amiri" style="font-family: 'Amiri';">Amiri - أميري</option>

                            <option value="Aref Ruqaa" style="font-family: 'Aref Ruqaa';">Aref Ruqaa - عارف رقعة</option>

                            <option value="Changa" style="font-family: 'Changa';">Changa - تشانغا</option>

                            <option value="El Messiri" style="font-family: 'El Messiri';">El Messiri - المسيري</option>

                            <option value="Harmattan" style="font-family: 'Harmattan';">Harmattan - هرمتان</option>

                            <option value="Katibeh" style="font-family: 'Katibeh';">Katibeh - كتيبة</option>

                            <option value="Lalezar" style="font-family: 'Lalezar';">Lalezar - لاليزار</option>

                            <option value="Lateef" style="font-family: 'Lateef';">Lateef - لطيف</option>

                            <option value="Lemonada" style="font-family: 'Lemonada';">Lemonada - ليمونادة</option>

                            <option value="Mada" style="font-family: 'Mada';">Mada - مدى</option>

                            <option value="Marhey" style="font-family: 'Marhey';">Marhey - مرحي</option>

                            <option value="Mirza" style="font-family: 'Mirza';">Mirza - مرزا</option>

                            <option value="Naskh MD" style="font-family: 'Naskh MD';">Naskh MD - نسخ</option>

                            <option value="Noto Kufi Arabic" style="font-family: 'Noto Kufi Arabic';">Noto Kufi - نوتو كوفي</option>

                            <option value="Noto Naskh Arabic" style="font-family: 'Noto Naskh Arabic';">Noto Naskh - نوتو نسخ</option>

                    <div>

    <!-- App Logic & Scripts -->

    <script>

        // --- 1. Firebase Config ---

        const firebaseConfig = {

            apiKey: "AIzaSyDummyKeyReplaceWithYourOwnAppKey",

            authDomain: "your-app.firebaseapp.com",

            projectId: "your-app-id",

            storageBucket: "your-app.appspot.com",

            messagingSenderId: "123456789",

            appId: "1:123456789:web:abc123def456"

        };



        // Initialize Firebase safely

        if (!firebase.apps.length) {

            firebase.initializeApp(firebaseConfig);

        }

        const authCloud = firebase.auth();

        const dbCloud = firebase.firestore();



        let currentUser = null;



        authCloud.onAuthStateChanged((user) => {

            currentUser = user;

            if (user) {

                document.getElementById('authLoggedOut').classList.add('hidden');

                document.getElementById('authLoggedIn').classList.remove('hidden');

                document.getElementById('userAvatar').src = user.photoURL || 'https://via.placeholder.com/30';

                document.getElementById('userName').innerText = user.displayName || user.email;

            } else {

                document.getElementById('authLoggedOut').classList.remove('hidden');

                document.getElementById('authLoggedIn').classList.add('hidden');

            }

        });



        function loginWithGoogle() {

            const provider = new firebase.auth.GoogleAuthProvider();

            authCloud.signInWithPopup(provider).catch(err => {

                alert('فشل تسجيل الدخول: ' + err.message);

            });

        }



        function logoutFirebase() {

            authCloud.signOut();

        }



        // --- 2. Data Structure & State ---

        let db = JSON.parse(localStorage.getItem('app_store_db')) || {

            sales: [],

            expenses: [],

            customers: [],

            settings: {

                storeName: 'متجري الذكي',

                currency: 'ر.س',

                font: 'Rubik',

                thankMsg: 'شكراً لتعاملك معنا!'

            }

        };



        let currentLang = localStorage.getItem('app_lang') || 'ar';



        // Save local

        function saveLocal() {

            localStorage.setItem('app_store_db', JSON.stringify(db));

            updateUI();

        }



        // --- 3. Firebase Cloud Synchronization (Fixed & Synchronized) ---

        async function backupToFirebase() {

            if (!currentUser) {

                alert(currentLang === 'ar' ? 'الرجاء تسجيل الدخول أولاً!' : 'Please sign in first!');

                return;

            }

            try {

                await dbCloud.collection('users_data').doc(currentUser.uid).set(db);

                alert(currentLang === 'ar' ? 'تم حفظ النسخة الاحتياطية في السحابة بنجاح! ✓' : 'Cloud backup saved successfully! ✓');

            } catch (error) {

                console.error("Backup error:", error);

                alert(currentLang === 'ar' ? 'حدث خطأ أثناء النسخ الاحتياطي.' : 'Error performing cloud backup.');

            }

        }



        async function restoreFromFirebase() {

            if (!currentUser) {

                alert(currentLang === 'ar' ? 'الرجاء تسجيل الدخول أولاً!' : 'Please sign in first!');

                return;

            }



            const confirmMsg = currentLang === 'ar' 

                ? 'هل أنت متأكد من استعادة النسخة الاحتياطية من سحابة Firebase؟ سيتم استبدال البيانات الحالية.' 

                : 'Are you sure you want to restore the backup from Firebase? Current data will be replaced.';



            if (confirm(confirmMsg)) {

                try {

                    const docRef = dbCloud.collection('users_data').doc(currentUser.uid);

                    const docSnap = await docRef.get();



                    if (docSnap.exists) {

                        const cloudData = docSnap.data();

                        if (cloudData && (cloudData.sales || cloudData.expenses || cloudData.customers)) {

                            db = cloudData;

                            if(!db.settings) {

                                db.settings = { storeName: '', storeDesc: '', currency: 'ر.س', font: 'Rubik', logo: '', thankMsg: 'شكراً لتعاملك معنا!' };

                            }

                            

                            saveLocal();

                            applySettings();

                            alert(currentLang === 'ar' ? 'تمت استعادة النسخة الاحتياطية من السحابة بنجاح! ✓' : 'Backup restored from cloud successfully! ✓');

                        } else {

                            alert(currentLang === 'ar' ? 'الملف الموجود في السحابة فارغ أو غير صالح!' : 'Cloud backup data is empty or invalid!');

                        }

                    } else {

                        alert(currentLang === 'ar' ? 'لا توجد أي نسخة احتياطية محفوظة مسبقاً في سحابة Firebase لهذا الحساب!' : 'No backup found in Firebase for this account!');

                    }

                } catch (error) {

                    console.error("Error restoring from Firebase: ", error);

                    alert(currentLang === 'ar' ? 'حدث خطأ أثناء الاتصال بالسحابة واستعادة البيانات.' : 'Error connecting to cloud for restoration.');

                }

            }

        }



        // --- 4. Navigation & Interface ---

        function switchTab(tabName) {

            ['dashboard', 'pos', 'sales', 'expenses', 'customers', 'settings'].forEach(t => {

                const sec = document.getElementById('section' + t.charAt(0).toUpperCase() + t.slice(1));

                const btn = document.getElementById('tab-' + t);

                if (t === tabName) {

                    sec.classList.remove('hidden');

                    btn.classList.add('border-indigo-400');

                    btn.classList.remove('border-transparent');

                } else {

                    sec.classList.add('hidden');

                    btn.classList.remove('border-indigo-400');

                    btn.classList.add('border-transparent');

                }

            });

        }



        function previewFont(fontName) {

            document.body.style.fontFamily = `'${fontName}', sans-serif`;

        }



        function applySettings() {

            if(db.settings) {

                document.getElementById('settingStoreName').value = db.settings.storeName || '';

                document.getElementById('settingCurrency').value = db.settings.currency || 'ر.س';

                document.getElementById('settingFont').value = db.settings.font || 'Rubik';

                document.getElementById('settingThankMsg').value = db.settings.thankMsg || '';

                previewFont(db.settings.font || 'Rubik');

            }

        }



        function saveSettings(e) {

            e.preventDefault();

            db.settings = {

                storeName: document.getElementById('settingStoreName').value,

                currency: document.getElementById('settingCurrency').value,

                font: document.getElementById('settingFont').value,

                thankMsg: document.getElementById('settingThankMsg').value

            };

            saveLocal();

            alert(currentLang === 'ar' ? 'تم حفظ الإعدادات بنجاح!' : 'Settings saved successfully!');

        }



        // --- 5. Data Actions ---

        function addInvoice(e) {

            e.preventDefault();

            const invoice = {

                id: Date.now(),

                customer: document.getElementById('posCustomer').value || 'عميل نقدي',

                description: document.getElementById('posDescription').value,

                amount: parseFloat(document.getElementById('posAmount').value),

                date: document.getElementById('posDate').value

            };

            db.sales.push(invoice);

            saveLocal();

            document.getElementById('posForm').reset();

            document.getElementById('posDate').valueAsDate = new Date();

            switchTab('sales');

        }



        function addExpense(e) {

            e.preventDefault();

            const exp = {

                id: Date.now(),

                description: document.getElementById('expDesc').value,

                amount: parseFloat(document.getElementById('expAmount').value),

                date: document.getElementById('expDate').value

            };

            db.expenses.push(exp);

            saveLocal();

            document.getElementById('expenseForm').reset();

        }



        function addCustomer(e) {

            e.preventDefault();

            const cust = {

                id: Date.now(),

                name: document.getElementById('custName').value,

                phone: document.getElementById('custPhone').value

            };

            db.customers.push(cust);

            saveLocal();

            document.getElementById('customerForm').reset();

        }



        function deleteItem(type, id) {

            if (confirm('هل أنت متأكد من الحذف؟')) {

                db[type] = db[type].filter(item => item.id !== id);

                saveLocal();

            }

        }



        // --- 6. Render UI ---

        function updateUI() {

            const currency = db.settings.currency || 'ر.س';



            // Stats

            const totalSales = db.sales.reduce((sum, item) => sum + item.amount, 0);

            const totalExpenses = db.expenses.reduce((sum, item) => sum + item.amount, 0);

            document.getElementById('statTotalSales').innerText = `${totalSales.toFixed(2)} ${currency}`;

            document.getElementById('statTotalExpenses').innerText = `${totalExpenses.toFixed(2)} ${currency}`;

            document.getElementById('statNetProfit').innerText = `${(totalSales - totalExpenses).toFixed(2)} ${currency}`;



            // Tables

            document.getElementById('salesTableBody').innerHTML = db.sales.map(item => `

                <tr class="border-b">

                    <td class="p-4">#${item.id}</td>

                    <td class="p-4">${item.customer}</td>

                    <td class="p-4">${item.description}</td>

                    <td class="p-4">${item.date}</td>

                    <td class="p-4 font-bold text-emerald-600">${item.amount.toFixed(2)} ${currency}</td>

                    <td class="p-4 no-print">

                        <button onclick="deleteItem('sales', ${item.id})" class="text-rose-600 hover:text-rose-800"><i class="fa-solid fa-trash"></i></button>

                    </td>

                </tr>

            `).join('');



            document.getElementById('expensesTableBody').innerHTML = db.expenses.map(item => `

                <tr class="border-b">

                    <td class="p-4">${item.description}</td>

                    <td class="p-4">${item.date}</td>

                    <td class="p-4 font-bold text-rose-600">${item.amount.toFixed(2)} ${currency}</td>

                    <td class="p-4 no-print">

                        <button onclick="deleteItem('expenses', ${item.id})" class="text-rose-600 hover:text-rose-800"><i class="fa-solid fa-trash"></i></button>

                    </td>

                </tr>

            `).join('');



            document.getElementById('customersTableBody').innerHTML = db.customers.map(item => `

                <tr class="border-b">

                    <td class="p-4 font-bold">${item.name}</td>

                    <td class="p-4">${item.phone || '-'}</td>

                    <td class="p-4 no-print">

                        <button onclick="deleteItem('customers', ${item.id})" class="text-rose-600 hover:text-rose-800"><i class="fa-solid fa-trash"></i></button>

                    </td>

                </tr>

            `).join('');



            // Select Dropdown

            const selectCust = document.getElementById('posCustomer');

            selectCust.innerHTML = `<option value="">عميل نقدي (عام)</option>` + 

                db.customers.map(c => `<option value="${c.name}">${c.name}</option>`).join('');

        }



        // --- Init ---

        document.getElementById('posDate').valueAsDate = new Date();

        document.getElementById('expDate').valueAsDate = new Date();

        applySettings();

        updateUI();

    </script>

</body>

</html>
